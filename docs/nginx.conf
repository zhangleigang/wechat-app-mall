# ============================================================================
# Nginx配置文件 - AI面试助手知识库API
# ============================================================================
# 用途：为微信小程序提供HTTPS API服务和静态文件服务
# 域名：api.feelnow.cn
# 端口策略：
#   - 8080: HTTP（重定向到HTTPS）
#   - 443:  标准HTTPS（微信小程序要求，反向代理到8443）
#   - 8443: 实际HTTPS服务（提供API和静态文件）
# ============================================================================

# ----------------------------------------------------------------------------
# 服务器1: HTTP服务器（端口8080）
# ----------------------------------------------------------------------------
# 作用：将所有HTTP请求重定向到HTTPS，确保安全性
# 访问：http://api.feelnow.cn:8080 → https://api.feelnow.cn:8443
# ----------------------------------------------------------------------------
server {
    listen 8080;
    server_name api.feelnow.cn;
    
    # 强制重定向到HTTPS（保留原始请求路径和参数）
    # 301: 永久重定向，浏览器会缓存此规则
    return 301 https://$server_name:8443$request_uri;
}

# ----------------------------------------------------------------------------
# 服务器2: 标准HTTPS服务器（端口443）- 微信小程序专用
# ----------------------------------------------------------------------------
# 作用：为微信小程序提供标准443端口的HTTPS服务
# 原因：微信小程序不支持自定义端口，只能使用标准443端口
# 实现：反向代理到8443端口的实际服务
# 访问：https://api.feelnow.cn → 转发到 https://localhost:8443
# ----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.feelnow.cn;
    
    # ========================================================================
    # SSL证书配置
    # ========================================================================
    # 证书文件路径（需要根据实际情况修改）
    ssl_certificate /etc/ssl/cert/api.feelnow.cn.pem;
    ssl_certificate_key /etc/ssl/cert/api.feelnow.cn.key;
    
    # SSL协议版本（只允许TLS 1.2和1.3，禁用不安全的旧版本）
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # 加密套件（使用高强度加密，禁用弱加密）
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5:!RC4:!DHE';
    ssl_prefer_server_ciphers on;
    
    # SSL会话缓存（提高性能，减少握手次数）
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # ========================================================================
    # 安全头部
    # ========================================================================
    # HSTS: 强制浏览器使用HTTPS（1年有效期）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 防止点击劫持攻击
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # 防止MIME类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS保护
    add_header X-XSS-Protection "1; mode=block" always;
    
    # ========================================================================
    # 日志配置
    # ========================================================================
    access_log /var/log/nginx/api-443-access.log;
    error_log /var/log/nginx/api-443-error.log warn;
    
    # ========================================================================
    # 反向代理配置
    # ========================================================================
    # 将所有请求转发到8443端口的实际服务
    location / {
        # 转发到本地8443端口（实际的HTTPS服务）
        proxy_pass https://localhost:8443;
        
        # 使用HTTP/1.1协议
        proxy_http_version 1.1;
        
        # 传递原始请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket支持（如果后端需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置（根据实际需求调整）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 信任上游服务器的SSL证书（因为是本地自签名）
        proxy_ssl_verify off;
    }
}

# ----------------------------------------------------------------------------
# 服务器3: 实际HTTPS服务器（端口8443）
# ----------------------------------------------------------------------------
# 作用：提供实际的API服务和静态文件服务
# 端口：8443（非标准端口，避免与其他服务冲突）
# 后端：Node.js应用（端口3000）
# 静态文件：/var/static/（收款码等图片）
# ----------------------------------------------------------------------------
server {
    listen 8443 ssl http2;
    server_name api.feelnow.cn;
    
    # ========================================================================
    # SSL证书配置（与443端口相同）
    # ========================================================================
    ssl_certificate /etc/ssl/cert/api.feelnow.cn.pem;
    ssl_certificate_key /etc/ssl/cert/api.feelnow.cn.key;
    
    # SSL协议版本
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # 加密套件
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5:!RC4:!DHE';
    ssl_prefer_server_ciphers on;
    
    # SSL会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # ========================================================================
    # 安全头部
    # ========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # ========================================================================
    # 日志配置
    # ========================================================================
    access_log /var/log/nginx/api-8443-access.log;
    error_log /var/log/nginx/api-8443-error.log warn;
    
    # ========================================================================
    # 静态文件服务（优先级最高）
    # ========================================================================
    # 路径：/static/* → /var/static/*
    # 用途：提供收款码图片、其他静态资源
    # 示例：https://api.feelnow.cn:8443/static/images/payment-qrcode.png
    # ========================================================================
    location /static/ {
        # 映射到服务器文件系统路径
        alias /var/static/;
        
        # 文件索引（可选，建议关闭以提高安全性）
        autoindex off;
        
        # 缓存策略：30天强缓存
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # CORS跨域支持（允许小程序访问）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
        
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
        
        # 关闭访问日志（静态文件不需要记录）
        access_log off;
        
        # 文件不存在时返回404
        try_files $uri =404;
        
        # 安全：禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # ========================================================================
    # API服务（反向代理到Node.js应用）
    # ========================================================================
    # 路径：/* （除了/static/之外的所有请求）
    # 后端：http://127.0.0.1:3000（Node.js Express应用）
    # 用途：知识库API、认证API等
    # ========================================================================
    location / {
        # 转发到Node.js应用
        proxy_pass http://127.0.0.1:3000;
        
        # 使用HTTP/1.1协议（支持keep-alive）
        proxy_http_version 1.1;
        
        # ====================================================================
        # 代理头部配置
        # ====================================================================
        # 传递原始Host头（重要：让后端知道原始域名）
        proxy_set_header Host $host;
        
        # 传递真实客户端IP
        proxy_set_header X-Real-IP $remote_addr;
        
        # 传递代理链IP（支持多级代理）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 传递原始协议（http或https）
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 传递原始主机名
        proxy_set_header X-Forwarded-Host $host;
        
        # 传递原始端口
        proxy_set_header X-Forwarded-Port $server_port;
        
        # ====================================================================
        # WebSocket支持（如果需要实时通信）
        # ====================================================================
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # ====================================================================
        # 超时设置
        # ====================================================================
        # 连接超时：与后端建立连接的最大时间
        proxy_connect_timeout 60s;
        
        # 发送超时：向后端发送数据的最大时间
        proxy_send_timeout 60s;
        
        # 读取超时：从后端读取响应的最大时间
        proxy_read_timeout 60s;
        
        # ====================================================================
        # 缓冲设置（优化性能）
        # ====================================================================
        # 启用缓冲（提高性能）
        proxy_buffering on;
        
        # 缓冲区大小
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 最大临时文件大小
        proxy_max_temp_file_size 1024m;
        
        # ====================================================================
        # 错误处理
        # ====================================================================
        # 后端错误时不显示Nginx版本信息
        proxy_intercept_errors off;
        
        # ====================================================================
        # 请求体大小限制
        # ====================================================================
        # 允许上传的最大文件大小（根据实际需求调整）
        client_max_body_size 10m;
    }
    
    # ========================================================================
    # 健康检查端点（可选）
    # ========================================================================
    # 用途：监控服务状态
    # 访问：https://api.feelnow.cn:8443/health
    # ========================================================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # ========================================================================
    # 安全：禁止访问隐藏文件和敏感文件
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================================
# 配置说明和注意事项
# ============================================================================
# 
# 1. 端口使用策略：
#    - 8080: HTTP入口，自动重定向到HTTPS
#    - 443:  微信小程序专用，反向代理到8443
#    - 8443: 实际服务端口，提供API和静态文件
#
# 2. 为什么需要443端口？
#    - 微信小程序只支持标准443端口
#    - 不能使用自定义端口（如8443）
#    - 通过反向代理解决此限制
#
# 3. SSL证书要求：
#    - 必须是有效的SSL证书（不能是自签名）
#    - 域名必须备案
#    - 证书路径需要根据实际情况修改
#
# 4. 防火墙配置：
#    - 需要开放端口：80, 443, 8080, 8443
#    - 命令：firewall-cmd --permanent --add-port={80,443,8080,8443}/tcp
#    - 重载：firewall-cmd --reload
#
# 5. 静态文件目录：
#    - 路径：/var/static/
#    - 需要创建：mkdir -p /var/static/images
#    - 权限：chmod 755 /var/static
#    - 收款码：/var/static/images/payment-qrcode.png
#
# 6. 日志文件：
#    - 访问日志：/var/log/nginx/api-*-access.log
#    - 错误日志：/var/log/nginx/api-*-error.log
#    - 需要定期清理或配置日志轮转
#
# 7. 性能优化建议：
#    - 启用gzip压缩（在http块中配置）
#    - 配置日志轮转（logrotate）
#    - 监控服务器资源使用情况
#
# 8. 测试配置：
#    - 检查语法：nginx -t
#    - 重载配置：nginx -s reload
#    - 查看状态：systemctl status nginx
#
# 9. 微信小程序配置：
#    - 在微信后台添加域名白名单：https://api.feelnow.cn
#    - request合法域名：https://api.feelnow.cn
#    - downloadFile合法域名：https://api.feelnow.cn
#
# 10. 小程序代码配置：
#     - config.js中使用：https://api.feelnow.cn/api
#     - 不要带端口号（使用标准443端口）
#
# ============================================================================